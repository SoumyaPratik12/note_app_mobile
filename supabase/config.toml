# Minimal Supabase config for local development (`supabase start`).
# The project_id is local-only; your hosted project is linked via
# `supabase link --project-ref <ref>`.
project_id = "inksync"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Update to your app scheme / deep link for OAuth redirects.
site_url = "inksync://"
additional_redirect_urls = ["inksync://"]
enable_signup = true

[auth.email]
enable_signup = true
# OTP confirmation is what the /verify-email screen consumes.
enable_confirmations = true

[functions.capture-page]
verify_jwt = true
